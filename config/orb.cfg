# Strategy, cost and walk-forward settings shared by py/orb_sim.py, cpp/wf_grid and cpp/orb_bt.
# Both simulators parse this one file, so the Python and C++ runs cannot drift apart on parameters.
# Session times here must match .cfg.sessOpen / .cfg.sessClose in q/config.q.

# --- instrument (COMEX GC: 0.10 tick, 100 oz, $10 per tick) ---
tick          = 0.1
tick_value    = 10.0

# --- costs, per contract ---
fee_per_side  = 2.50      # commission + exchange + clearing, USD per side
slip_ticks    = 1         # adverse slippage on every stop / market fill (entries, stops, EOD exit)

# --- session, America/New_York, bar START times ---
sess_open     = 08:20     # COMEX day-session open; the opening range starts here
sess_close    = 13:30     # last bar in the window starts 13:29; open positions exit on its close
entry_cutoff  = 13:00     # no new entries on bars starting at or after this time

# --- parameter grid: 4 x 3 x 3 x 4 x 3 = 432 configurations ---
grid.or_min     = 5,15,30,60          # opening-range length, minutes
grid.stop_frac  = 0.5,0.75,1.0        # stop distance as a fraction of the opening-range width
grid.target_r   = 1.0,1.5,2.0         # profit target as a multiple of the stop distance
grid.min_relvol = 0.0,0.8,1.0,1.2     # trade only if opening-range volume / trailing average >= this
grid.max_wtov   = 0.35,0.6,inf        # skip if OR width / (rv20 * price) > this (inf = no filter)

# --- walk-forward: six half-year out-of-sample folds, 2022-2024 ---
folds = 20220101:20220630,20220701:20221231,20230101:20230630,20230701:20231231,20240101:20240630,20240701:20241231
train_years   = 0         # 0 = anchored/expanding window from the first date in the data; N = rolling N years
min_trades    = 30        # a config needs at least this many in-sample trades to be eligible
